<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make a Wish</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#FFF7EC;--bg2:#FFE3EE;--bg3:#DCEBFF;--ink:#4A3B5C;--sub:#7A6A8C;--btn:#F79AB9;--btn2:#E97BA2;--btnink:#3B2A4A;--p1:#FFC8DD;--p2:#CDB4F6;--p3:#BDE0FE;--p4:#FFF1C1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2B2340;--bg2:#3A2C52;--bg3:#243559;--ink:#FFEFF6;--sub:#CDBFE0}}
:root[data-theme="dark"]{--bg1:#2B2340;--bg2:#3A2C52;--bg3:#243559;--ink:#FFEFF6;--sub:#CDBFE0}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;bottom:-40px;border-radius:50%;opacity:.55;animation:floatUp linear infinite}
.bg i.ring{background:none!important;border:2px solid var(--p2)}
@keyframes floatUp{to{transform:translate(var(--sx),-115vh)}}

#intro{position:fixed;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:24px;transition:opacity .5s,transform .5s,visibility .5s}
#intro.gone{opacity:0;transform:scale(.94);visibility:hidden;pointer-events:none}
h1{margin:0;font-weight:600;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
#intro p{margin:0 0 14px;color:var(--sub);font-size:clamp(1rem,3.4vw,1.2rem);max-width:26ch}

.btn{font:600 1.1rem/1 Fredoka,"Trebuchet MS",sans-serif;padding:.95em 1.7em;border:0;border-radius:999px;background:var(--btn);color:var(--btnink);cursor:pointer;
box-shadow:0 6px 0 var(--btn2),0 14px 26px rgba(233,123,162,.3);transition:transform .18s,box-shadow .18s,opacity .5s,visibility .5s}
.btn:not(:disabled):hover{transform:translateY(-3px)}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn2),0 4px 10px rgba(233,123,162,.3)}
.btn:focus-visible,#snd:focus-visible{outline:3px solid var(--p3);outline-offset:4px}
.btn.alt{background:var(--p2);box-shadow:0 6px 0 #A78EDD,0 14px 26px rgba(167,142,221,.3)}
.btn.alt:not(:disabled):active{box-shadow:0 2px 0 #A78EDD}
.btn.hide{opacity:0;visibility:hidden;pointer-events:none}

#scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.5vh,20px);padding:16px;pointer-events:none}
.msgbox{display:grid;min-height:3rem;text-align:center;align-items:center}
.msg{grid-area:1/1;margin:0;font-weight:600;font-size:clamp(1.5rem,6.2vw,2.3rem);opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s}
.msg.on{opacity:1;transform:none}
.cakebox{position:relative;width:max(200px,min(88vw,380px,calc((100vh - 230px) * 1.18)));transform:translateY(120vh);transition:transform .8s cubic-bezier(.55,0,.8,.4)}
#scene.show .cakebox{transform:none;transition:transform 1.5s cubic-bezier(.34,1.56,.64,1)}
.cakebox svg{display:block;width:100%;height:auto;overflow:visible}
.actions{display:grid;min-height:62px;place-items:center}
.actions .btn{grid-area:1/1;pointer-events:auto}

.cbody{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);opacity:0}
.candle.up .cbody{transform:none;opacity:1;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0}
.candle.lit .flame{transform:none;opacity:1;animation:ignite .5s ease-out both,flick calc(.9s + var(--i) * .17s) ease-in-out .5s infinite alternate}
@keyframes ignite{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.09) rotate(2.5deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
.cake.blowing .candle.lit .flame{animation:lean .8s ease-in-out both}
@keyframes lean{to{transform:rotate(26deg) scale(1,.85)}}
.cake.blowing .candle.out .flame{transform:scale(0);opacity:0;animation:snuff .55s ease-in both}
@keyframes snuff{0%{transform:rotate(30deg) scale(1,.85);opacity:1}100%{transform:rotate(46deg) scale(0);opacity:0}}

.wind{position:absolute;left:-25%;height:3px;width:var(--w);border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));opacity:0;pointer-events:none}
.blowing .wind{animation:gust 1.1s ease-in-out var(--d) both}
@keyframes gust{0%{left:-25%;opacity:0}25%{opacity:1}100%{left:112%;opacity:0}}

#fx{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.smoke{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle,rgba(190,180,205,.8),rgba(190,180,205,0) 70%);opacity:0;animation:smoke 2.4s ease-out both}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),-90px) scale(3)}}
.sparkle{position:absolute;width:18px;height:18px;background:#FFD36E;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;pointer-events:none;animation:twinkle 1.8s ease-in-out infinite}
.sparkle:nth-child(3n){background:#F79AB9}.sparkle:nth-child(3n+1){background:#8CC8FA}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(var(--s)) rotate(90deg)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#snd{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border:0;border-radius:50%;background:var(--p3);font-size:1.15rem;cursor:pointer;transition:transform .18s}
#snd:hover{transform:scale(1.08)}#snd:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.bg{display:none}*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<button id="snd" aria-pressed="true" aria-label="Sound on">🔊</button>
<audio id="birthdaySong" src="song/VoiceAudio.mp3" preload="auto" loop></audio>

<section id="intro">
  <h1>Happy Birthday!</h1>
  <p>Take a moment and think of something you really want.</p>
  <button class="btn" id="wish">Make a Wish 🎂</button>
</section>

<section id="scene">
  <div class="msgbox" aria-live="polite">
    <h2 class="msg" id="msg">Happy Birthday! 🎉</h2>
    <h2 class="msg" id="win">I love you babi</h2>
  </div>
  <div class="cakebox cake" id="cake">
    <svg viewBox="0 0 320 270" role="img" aria-label="A two-tier birthday cake with five candles">
      <ellipse cx="160" cy="262" rx="132" ry="8" fill="#5A3C78" opacity=".14"/>
      <ellipse cx="160" cy="250" rx="146" ry="16" fill="#CFE2FA"/>
      <ellipse cx="160" cy="246" rx="146" ry="14" fill="#E8F2FF"/>
      <rect x="36" y="158" width="248" height="90" rx="20" fill="#FFC2D9"/>
      <path d="M36 178Q36 158 56 158H264Q284 158 284 178V182q-15.5 36-31 0q-15.5 20-31 0q-15.5 44-31 0q-15.5 24-31 0q-15.5 40-31 0q-15.5 46-31 0q-15.5 22-31 0q-15.5 34-31 0Z" fill="#FFF7EC"/>
      <g id="dots" fill="#FFF7EC"></g>
      <rect x="76" y="98" width="168" height="66" rx="16" fill="#D9C8FA"/>
      <g id="candles"></g>
      <path d="M76 116Q76 98 94 98H226Q244 98 244 116V120q-14 34-28 0q-14 20-28 0q-14 42-28 0q-14 22-28 0q-14 38-28 0q-14 26-28 0Z" fill="#FFF7EC"/>
      <g id="spr"></g>
    </svg>
    <i class="wind" style="top:8%;--w:70px;--d:0s"></i>
    <i class="wind" style="top:13%;--w:50px;--d:.12s"></i>
    <i class="wind" style="top:18%;--w:90px;--d:.06s"></i>
    <i class="wind" style="top:23%;--w:60px;--d:.2s"></i>
  </div>
  <div class="actions">
    <button class="btn hide" id="blow" disabled>Blow the Candles 💨</button>
    <button class="btn alt hide" id="again" disabled>Celebrate Again 🎂</button>
  </div>
</section>

<div id="fx"></div>
<canvas id="confetti"></canvas>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let busy=false,sound=true;

/* Background particles */
$('#bg').innerHTML=Array.from({length:18},(_,i)=>{
  const s=8+Math.random()*22,c=['--p1','--p2','--p3','--p4'][i%4];
  return `<i class="${i%3==0?'ring':''}" style="width:${s}px;height:${s}px;left:${Math.random()*100}%;background:var(${c});--sx:${(Math.random()-.5)*80}px;animation-duration:${14+Math.random()*14}s;animation-delay:-${Math.random()*24}s"></i>`;
}).join('');

/* Cake details */
const cols=['#BDE0FE','#FFD1E3','#E4D6FB','#FFF3C4','#BDE0FE'];
$('#candles').innerHTML=[108,134,160,186,212].map((x,i)=>`<g class="candle" style="--i:${i}" transform="translate(${x} 0)"><g class="cbody"><rect x="-5" y="60" width="10" height="42" rx="3" fill="${cols[i]}"/><path d="M-5 70h10M-5 80h10M-5 90h10" stroke="#fff" stroke-opacity=".7" stroke-width="3"/><path d="M0 60V54" stroke="#6E5A80" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(0 54)"><g class="flame"><circle cy="-11" r="15" fill="#FFD986" opacity=".35"/><path d="M0-26C7-16 9-8 0 0-9-8-7-16 0-26Z" fill="#FFB347"/><path d="M0-14C3.5-9 4.5-5 0-1-4.5-5-3.5-9 0-14Z" fill="#FFF3B0"/></g></g></g>`).join('');
const sc=['#FFFFFF','#8CC8FA','#F79AB9','#FFD36E'];
const sp=[[96,140],[118,150],[140,138],[162,152],[184,140],[206,150],[228,138],[58,214],[86,222],[114,212],[142,224],[170,212],[198,222],[226,214],[254,222]];
$('#spr').innerHTML=sp.map(([x,y],i)=>`<rect x="${x-4}" y="${y}" width="8" height="3.5" rx="1.75" fill="${sc[i%4]}" transform="rotate(${(i*47)%180} ${x} ${y})"/>`).join('');
$('#dots').innerHTML=Array.from({length:10},(_,i)=>`<circle cx="${56+i*24.4}" cy="238" r="3.5"/>`).join('');

/* Sound (generated in-browser, no files) */
let ac;
function whoosh(){
  if(!sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
    const t=ac.currentTime,len=ac.sampleRate*1.2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource();src.buffer=buf;
    const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.6;
    f.frequency.setValueAtTime(500,t);f.frequency.linearRampToValueAtTime(1400,t+.9);
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.25);g.gain.linearRampToValueAtTime(0,t+1.1);
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t);
  }catch(e){}
}
const birthdaySong = document.getElementById('birthdaySong');
let songStarted = false;

function playBirthdaySong(){
  if(!sound || !birthdaySong || songStarted) return;
  songStarted = true;
  birthdaySong.volume = 1;
  birthdaySong.currentTime = 0;
  birthdaySong.play().catch(() => {});
  window.__birthdaySongPlayed = true;
}

$('#snd').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-pressed',sound);e.currentTarget.setAttribute('aria-label',sound?'Sound on':'Sound off'); if(!sound){ birthdaySong.pause(); birthdaySong.currentTime = 0; }};

/* Smoke + sparkles */
function smoke(c){
  const r=c.querySelector('.cbody').getBoundingClientRect(),x=r.left+r.width/2,y=r.top-4;
  for(let k=0;k<3;k++){
    const s=document.createElement('i');s.className='smoke';
    s.style.cssText=`left:${x}px;top:${y}px;--dx:${20+Math.random()*40}px;animation-delay:${k*.25}s`;
    $('#fx').appendChild(s);s.addEventListener('animationend',()=>s.remove());
  }
}
function sparkles(){
  for(let i=0;i<14;i++){
    const s=document.createElement('i');s.className='sparkle';
    s.style.cssText=`left:${-8+Math.random()*116}%;top:${-15+Math.random()*95}%;--s:${.6+Math.random()*.9};animation-delay:${Math.random()*1.6}s`;
    $('#cake').appendChild(s);
  }
}

/* Confetti (canvas) */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0,W,H;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
const cc=['#F79AB9','#B79CF0','#8CC8FA','#FFD36E','#7ED9B8','#FF9CB8'];
function confetti(){
  const r=$('#cake').getBoundingClientRect(),n=reduce?40:150;
  for(let i=0;i<n;i++){
    const burst=i%2==0,a=-Math.PI/2+(Math.random()-.5)*1.7,v=8+Math.random()*9;
    parts.push({x:burst?r.left+r.width/2:Math.random()*W,y:burst?r.top+20:-20-Math.random()*H*.5,
      vx:burst?Math.cos(a)*v:(Math.random()-.5)*2,vy:burst?Math.sin(a)*v:1+Math.random()*2,
      w:6+Math.random()*6,h:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
      c:cc[i%cc.length],o:Math.random()<.3,t:Math.random()*6});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.y<H+30);
  for(const p of parts){
    p.vy+=.2;p.vy*=.985;p.vx*=.99;p.t+=.06;p.x+=p.vx+Math.sin(p.t)*.6;p.y+=p.vy;p.rot+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.o){cx.beginPath();cx.arc(0,0,p.w/2.4,0,7);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,W,H);
}
function stopConfetti(){parts=[];cancelAnimationFrame(raf);raf=0;cx.clearRect(0,0,W,H)}

/* Sequence */
const candles=$$('.candle'),cake=$('#cake'),scene=$('#scene'),msg=$('#msg'),win=$('#win'),
      wish=$('#wish'),blow=$('#blow'),again=$('#again'),intro=$('#intro');
const show=b=>{b.disabled=false;b.classList.remove('hide')},hide=b=>{b.disabled=true;b.classList.add('hide')};

wish.onclick=async()=>{
  if(busy)return;busy=true;wish.disabled=true;
  playBirthdaySong();
  intro.classList.add('gone');await sleep(450);
  scene.classList.add('show');await sleep(1500);
  for(const c of candles){c.classList.add('up');await sleep(260)}
  await sleep(500);
  for(const c of candles){c.classList.add('lit');await sleep(180)}
  await sleep(600);
  msg.classList.add('on');await sleep(900);
  show(blow);busy=false;
};

blow.onclick=async()=>{
  if(busy)return;busy=true;hide(blow);
  cake.classList.add('blowing');whoosh();await sleep(700);
  for(const c of candles){c.classList.add('out');smoke(c);await sleep(300)}
  await sleep(900);
  msg.classList.remove('on');win.classList.add('on');
  confetti();sparkles();await sleep(1400);
  show(again);busy=false;
};

again.onclick=async()=>{
  if(busy)return;busy=true;hide(again);
  songStarted = false;
  birthdaySong.pause();
  birthdaySong.currentTime = 0;
  win.classList.remove('on');stopConfetti();$$('.sparkle').forEach(e=>e.remove());
  scene.classList.remove('show');await sleep(1000);
  candles.forEach(c=>c.classList.remove('up','lit','out'));
  cake.classList.remove('blowing');msg.classList.remove('on');
  intro.classList.remove('gone');wish.disabled=false;busy=false;
};
</script>
</body>
</html>
